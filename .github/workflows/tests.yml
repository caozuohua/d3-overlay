name: tests

on:
  push:
    branches: [main, tests]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pygame-ce pytest requests beautifulsoup4
      - run: python tests/test_core.py
      - run: python tests/test_plugin_render.py
      - run: python tests/test_layout.py
      - run: python tests/test_hotkey_dispatch.py
      - run: python tests/test_thread_cleanup.py
      - run: python tests/test_config_reload.py
      - run: python tests/test_api_skills.py
      - run: python tests/test_api_auth.py
      - run: python tests/test_sno_parser.py
      - run: python tests/test_pipeline_smoke.py
      - run: python tests/test_build_assistant_data.py
      - run: python tests/test_build_assistant_scraper.py
